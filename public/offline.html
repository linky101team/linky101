<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkY101 — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0f172a;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
      }
      p {
        color: #94a3b8;
        font-weight: 700;
        font-size: 14px;
        max-width: 320px;
      }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        border: 3px solid #ff6b9d;
        background: linear-gradient(135deg, #ff6b9d, #a78bfa);
        color: #fff;
        font-weight: 900;
        text-transform: uppercase;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <span style="font-size: 48px">📡</span>
    <h1>You&rsquo;re Offline</h1>
    <p>LinkY101 needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
